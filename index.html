<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta name="description" content="助理与老板双人专属日程同步应用" />
    <title>老板日程同步</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=15" />
    <script>
      window.BOSS_BACKEND_MODE = location.hostname === "czy77zt.github.io" ? "github" : "local";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="reminder-overlay" class="reminder-overlay" hidden>
      <div class="reminder-card">
        <div class="reminder-kicker">日程提醒</div>
        <h2 id="reminder-title"></h2>
        <p id="reminder-detail"></p>
        <div class="reminder-actions">
          <button class="ghost-button" data-action="close-reminder">稍后提醒</button>
          <button class="primary-button" data-action="complete-reminder">标记完成</button>
        </div>
      </div>
    </div>
    <script src="app.js?v=15" defer></script>
  </body>
</html>
